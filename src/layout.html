<script>
// On a narrow screen the menu scrolls sideways: start with the current page's item in view.
(function () {
  var menu = document.querySelector(".nav");
  var current = menu && menu.querySelector("[aria-current]");
  if (!current) return;
  var over = current.getBoundingClientRect().right - menu.getBoundingClientRect().right;
  if (over > 0) menu.scrollLeft += over;
})();
</script>
</body>
</html>
