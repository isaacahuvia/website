# isaacahuvia.com is plain files. Netlify publishes the site/ folder as it is;
# nothing is built on Netlify. The command below only says so in the deploy log
# (and replaces any build command saved in the Netlify settings).

[build]
  publish = "site"
  command = "echo 'Nothing to build: the site folder is published as it is'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
